[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-inspector"
version = "0.3.2"
description = "See what is actually eating your AI agent's context window — per-message, per-category, per-tool token analysis for Claude Code, Codex CLI, and Kimi Code session logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Angel Cantu" }]
keywords = ["llm", "agents", "context-engineering", "token-usage", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/AngelCantugr/context-inspector"

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
analytics = ["duckdb>=1.0"]

[project.scripts]
context-inspector = "context_inspector.cli:main"

[tool.setuptools.packages.find]
include = ["context_inspector*"]

[tool.setuptools.package-data]
context_inspector = ["analytics/queries/*.sql", "analytics/queries/manifest.json"]
