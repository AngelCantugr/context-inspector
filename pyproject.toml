[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-inspector"
version = "0.3.2"
description = "See what is actually eating your AI agent's context window — per-message, per-category, per-tool token analysis for Claude Code, Codex CLI, and Kimi Code session logs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Angel Cantu" }]
keywords = ["llm", "agents", "context-engineering", "token-usage", "observability"]
classifiers = [
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/AngelCantugr/context-inspector"

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
analytics = ["duckdb>=1.0", "matplotlib>=3.8"]
agent = ["langgraph>=0.2", "anthropic>=0.40"]

[project.scripts]
context-inspector = "context_inspector.cli:main"

[dependency-groups]
dev = ["duckdb>=1.0", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["context_inspector"]
